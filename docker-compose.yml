services:
  efspjava:
    build:
      context: .
      target: release
      args:
        - CI_COMMIT_SHA
    # Necessary b/c docassemble is external to the docker network
    ports:
      - target: 9009
        published: 80
    env_file: .env
    depends_on:
      - "db"
    deploy:
      resources:
        limits:
          memory: 4G
  db:
    build:
      context: Docker
      dockerfile: pg-Dockerfile
    shm_size: 256m
    env_file: .env
    volumes:
      - data-volume:/var/lib/postgresql/data
      # run Docker/vault-key.sh before starting the docker compose database
      - ./Docker/pgsodium_root.key:/etc/postgresql-custom/pgsodium_root.key:Z

volumes:
  data-volume:
